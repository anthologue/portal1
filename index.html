<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aeronautics Tools Portal</title>

<script>
  // Applied before first paint to avoid a light/dark flash.
  (function () {
    var saved = localStorage.getItem('theme');
    var theme = saved === 'dark' || saved === 'light'
      ? saved
      : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap">

<script src="https://cdn.tailwindcss.com"></script>

<style>
  :root {
    --bg: #f3f8fc;
    --bg-elevated: #ffffff;
    --border: #d9e6f0;
    --ink: #1c2b3a;
    --ink-dim: #5b7286;
    --accent: #e07a3f;
    --accent-dim: #f7ddc9;
    --accent-ink: #ffffff;
  }
  html[data-theme="dark"] {
    --bg: #10161d;
    --bg-elevated: #182330;
    --border: #253340;
    --ink: #e9eff5;
    --ink-dim: #8fa2b3;
    --accent: #f0975a;
    --accent-dim: #3a2c22;
    --accent-ink: #10161d;
  }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
  }
  .font-display {
    font-family: 'Space Grotesk', system-ui, sans-serif;
  }
  a { color: var(--accent); }
  a:hover { color: var(--accent); opacity: 0.85; }

  [hidden] { display: none !important; }
</style>
</head>
<body class="min-h-screen flex flex-col">

  <header class="flex items-center justify-between px-6 sm:px-10 py-6 border-b" style="border-color: var(--border);">
    <div class="flex items-center gap-3">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 16 L22 12 L14 19 L11 17 L2 16 Z"/>
        <path d="M11 17 L9 22 L12 21 L13 18"/>
      </svg>
      <span class="font-display text-xl font-bold">Flight Lab</span>
    </div>

    <button id="theme-toggle" type="button"
      class="flex items-center gap-2 px-4 py-2 rounded-full text-sm"
      style="background: var(--bg-elevated); border: 1px solid var(--border); color: var(--ink-dim);"
      aria-pressed="false">
      <span id="theme-toggle-icon" aria-hidden="true"></span>
      <span id="theme-toggle-label">Dark</span>
    </button>
  </header>

  <main class="flex-1 px-6 sm:px-10 py-10 max-w-5xl w-full mx-auto">

    <!-- Home view: grid of tool cards -->
    <section id="home-view">
      <h1 class="font-display text-2xl font-bold mb-1">Tools &amp; learning artifacts</h1>
      <p class="mb-8" style="color: var(--ink-dim);">A growing set of interactive tools for learning the fundamentals of flight.</p>

      <div id="tool-grid" class="grid grid-cols-1 sm:grid-cols-2 gap-6"></div>
    </section>

    <!-- Tool view: shows the active tool -->
    <section id="tool-view" hidden>
      <button id="back-to-home" type="button" class="flex items-center gap-2 mb-6 text-sm font-medium" style="color: var(--accent);">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
        Back to all tools
      </button>

      <h2 id="tool-view-title" class="font-display text-2xl font-bold mb-4"></h2>
      <div id="tool-view-content" class="rounded-2xl p-8" style="background: var(--bg-elevated); border: 1px solid var(--border);"></div>
    </section>

  </main>

  <footer class="px-6 sm:px-10 py-6 text-xs text-center" style="color: var(--ink-dim);">
    Built for a beginner-to-aeronautics class.
  </footer>

  <script>
    // ---- Data model -------------------------------------------------

    var TOOLS = [
      {
        id: 'airfoil-visualizer',
        title: 'Airfoil Visualizer',
        description: 'Adjust the angle of attack on a NACA 2412 wing and watch a live flow simulation curve the air around it.',
        render: function (container) {
          renderAirfoilVisualizer(container);
        }
      },
      {
        id: 'placeholder-tool-2',
        title: 'Coming Soon',
        description: 'A second tool will land here as the collection grows.',
        render: function (container) {
          renderPlaceholder(container, 'Coming Soon');
        }
      }
    ];

    function renderPlaceholder(container, title) {
      container.innerHTML =
        '<p style="color: var(--ink-dim);">' +
        'Placeholder for &ldquo;' + title + '&rdquo;. This tool has not been built yet &mdash; ' +
        'this is just proving that navigation opens and closes a tool correctly.' +
        '</p>';
    }

    // ---- Airfoil Visualizer: NACA 2412 + live vortex-lattice flow solver ----
    //
    // A simplified, inviscid 2D potential-flow model (a small vortex-lattice
    // panel method), not a full CFD solver. It reproduces the qualitative
    // physics beginners need to see: cambered airfoils lift even at zero
    // angle of attack, lift grows with angle of attack, and — since the
    // model has no viscosity — flow separation past the stall angle is
    // added as a deliberate visual cue rather than a solved result.

    var AirfoilSim = (function () {
      var NACA = { m: 0.02, p: 0.4, t: 0.12 }; // NACA 2412
      var PANEL_COUNT = 10;
      var STREAMLINE_COUNT = 16;
      var STEP_COUNT = 140;
      var STEP_SIZE = 0.018; // chord units
      var STALL_ANGLE_DEG = 15;

      function nacaCamber(x) {
        var m = NACA.m, p = NACA.p;
        if (p === 0 || m === 0) return { yc: 0, dyc: 0 };
        if (x < p) {
          return {
            yc: (m / (p * p)) * (2 * p * x - x * x),
            dyc: (2 * m / (p * p)) * (p - x)
          };
        }
        return {
          yc: (m / ((1 - p) * (1 - p))) * ((1 - 2 * p) + 2 * p * x - x * x),
          dyc: (2 * m / ((1 - p) * (1 - p))) * (p - x)
        };
      }

      function nacaThickness(x) {
        var t = NACA.t;
        return 5 * t * (0.2969 * Math.sqrt(x) - 0.1260 * x - 0.3516 * x * x + 0.2843 * x * x * x - 0.1015 * x * x * x * x);
      }

      // Cosine spacing gives better resolution near the leading/trailing edge.
      function cosineStations(n) {
        var xs = [];
        for (var i = 0; i <= n; i++) {
          xs.push((1 - Math.cos(Math.PI * i / n)) / 2);
        }
        return xs;
      }

      function rotatePoint(x, y, angleRad, pivotX, pivotY) {
        var dx = x - pivotX, dy = y - pivotY;
        var cos = Math.cos(angleRad), sin = Math.sin(angleRad);
        return { x: pivotX + dx * cos - dy * sin, y: pivotY + dx * sin + dy * cos };
      }

      // Builds the airfoil surface polygon plus vortex-lattice panel data,
      // rotated by the angle of attack (freestream stays horizontal).
      function buildGeometry(alphaDeg) {
        var alphaRad = -alphaDeg * Math.PI / 180;
        var pivotX = 0.25, pivotY = 0; // quarter-chord

        var xs = cosineStations(60);
        var upper = [], lower = [];
        xs.forEach(function (x) {
          var c = nacaCamber(x);
          var yt = nacaThickness(x);
          var theta = Math.atan(c.dyc);
          var xu = x - yt * Math.sin(theta), yu = c.yc + yt * Math.cos(theta);
          var xl = x + yt * Math.sin(theta), yl = c.yc - yt * Math.cos(theta);
          upper.push(rotatePoint(xu, yu, alphaRad, pivotX, pivotY));
          lower.push(rotatePoint(xl, yl, alphaRad, pivotX, pivotY));
        });
        var polygon = upper.concat(lower.slice().reverse());

        var panelXs = cosineStations(PANEL_COUNT);
        var camberPts = panelXs.map(function (x) {
          var c = nacaCamber(x);
          return rotatePoint(x, c.yc, alphaRad, pivotX, pivotY);
        });

        var vortices = [], controls = [];
        for (var i = 0; i < PANEL_COUNT; i++) {
          var a = camberPts[i], b = camberPts[i + 1];
          vortices.push({ x: a.x + 0.25 * (b.x - a.x), y: a.y + 0.25 * (b.y - a.y) });
          var cx = a.x + 0.75 * (b.x - a.x), cy = a.y + 0.75 * (b.y - a.y);
          var dx = b.x - a.x, dy = b.y - a.y;
          var len = Math.sqrt(dx * dx + dy * dy) || 1e-6;
          controls.push({ x: cx, y: cy, nx: -dy / len, ny: dx / len });
        }

        return { polygon: polygon, vortices: vortices, controls: controls };
      }

      function inducedVelocity(px, py, vx, vy, gamma) {
        var dx = px - vx, dy = py - vy;
        var r2 = dx * dx + dy * dy;
        if (r2 < 1e-6) r2 = 1e-6;
        return { u: -gamma * dy / (2 * Math.PI * r2), v: gamma * dx / (2 * Math.PI * r2) };
      }

      // Small dense linear solve (Gaussian elimination with partial pivoting).
      function solveLinear(A, b) {
        var n = b.length;
        var M = A.map(function (row, i) { return row.concat([b[i]]); });
        for (var col = 0; col < n; col++) {
          var pivotRow = col;
          for (var r = col + 1; r < n; r++) {
            if (Math.abs(M[r][col]) > Math.abs(M[pivotRow][col])) pivotRow = r;
          }
          var tmp = M[col]; M[col] = M[pivotRow]; M[pivotRow] = tmp;
          var pivotVal = M[col][col] || 1e-9;
          for (var c = col; c <= n; c++) M[col][c] /= pivotVal;
          for (r = 0; r < n; r++) {
            if (r === col) continue;
            var factor = M[r][col];
            for (c = col; c <= n; c++) M[r][c] -= factor * M[col][c];
          }
        }
        return M.map(function (row) { return row[n]; });
      }

      // Solves vortex strengths so flow tangency holds at each control point.
      function solveCirculation(geo, U) {
        var n = geo.vortices.length;
        var A = [], b = [];
        for (var i = 0; i < n; i++) {
          var cp = geo.controls[i];
          var row = [];
          for (var j = 0; j < n; j++) {
            var vt = geo.vortices[j];
            var ind = inducedVelocity(cp.x, cp.y, vt.x, vt.y, 1);
            row.push(ind.u * cp.nx + ind.v * cp.ny);
          }
          A.push(row);
          b.push(-(U * cp.nx));
        }
        return solveLinear(A, b);
      }

      function velocityAt(px, py, geo, gammas, U) {
        var u = U, v = 0;
        for (var j = 0; j < geo.vortices.length; j++) {
          var vt = geo.vortices[j];
          var ind = inducedVelocity(px, py, vt.x, vt.y, gammas[j]);
          u += ind.u; v += ind.v;
        }
        return { u: u, v: v };
      }

      function pointInPolygon(x, y, poly) {
        var inside = false;
        for (var i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          var xi = poly[i].x, yi = poly[i].y, xj = poly[j].x, yj = poly[j].y;
          var intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
          if (intersect) inside = !inside;
        }
        return inside;
      }

      function computeStreamlines(geo, gammas, U, alphaDeg) {
        var stalling = Math.abs(alphaDeg) > STALL_ANGLE_DEG;
        var lines = [];
        for (var s = 0; s < STREAMLINE_COUNT; s++) {
          var y0 = -0.55 + (1.1 * s) / (STREAMLINE_COUNT - 1);
          var pos = { x: -0.65, y: y0 };
          var pts = [{ x: pos.x, y: pos.y }];
          var separated = false;
          for (var step = 0; step < STEP_COUNT; step++) {
            var vel = velocityAt(pos.x, pos.y, geo, gammas, U);

            if (stalling && pos.x > 0.35 && y0 > -0.05) separated = true;

            var speed = Math.sqrt(vel.u * vel.u + vel.v * vel.v) || 1e-6;
            var stepX = (vel.u / speed) * STEP_SIZE;
            var stepY = (vel.v / speed) * STEP_SIZE;
            if (separated) {
              stepY += Math.sin(step * 0.9 + s) * 0.006 * (1 + step / STEP_COUNT);
            }
            var next = { x: pos.x + stepX, y: pos.y + stepY };

            if (pointInPolygon(next.x, next.y, geo.polygon)) next = pos;
            pos = next;
            pts.push({ x: pos.x, y: pos.y });
            if (pos.x > 1.3) break;
          }
          lines.push(pts);
        }
        return lines;
      }

      return {
        STALL_ANGLE_DEG: STALL_ANGLE_DEG,
        buildGeometry: buildGeometry,
        solveCirculation: solveCirculation,
        computeStreamlines: computeStreamlines
      };
    })();

    // Set by whichever tool is currently open, so the shell's generic
    // navigation and theme toggle can stop its animation / redraw it.
    var activeToolCleanup = null;
    var activeToolRedraw = null;

    function renderAirfoilVisualizer(container) {
      container.innerHTML =
        '<div class="flex flex-col gap-6">' +
          '<div class="flex flex-wrap items-end justify-between gap-6">' +
            '<div>' +
              '<label for="aoa-slider" class="block text-sm font-medium mb-1">' +
                'Angle of attack: <span id="aoa-value">5</span>&deg;' +
              '</label>' +
              '<input id="aoa-slider" type="range" min="-10" max="20" step="1" value="5" class="w-64">' +
            '</div>' +
            '<div class="text-sm text-right leading-relaxed" style="color: var(--ink-dim);">' +
              'Lift coefficient (C<sub>L</sub>): <strong id="cl-value" style="color: var(--ink);">0.00</strong><br>' +
              '<span id="stall-warning" style="color: var(--accent); font-weight: 600;"></span>' +
            '</div>' +
          '</div>' +
          '<canvas id="airfoil-canvas" width="700" height="380" class="w-full rounded-xl" ' +
            'style="background: var(--bg); border: 1px solid var(--border);"></canvas>' +
          '<p class="text-xs leading-relaxed" style="color: var(--ink-dim);">' +
            'NACA 2412 airfoil, driven by a 10-panel vortex-lattice potential-flow solver computed ' +
            'live in your browser. It&rsquo;s a simplified, inviscid teaching model &mdash; not a full ' +
            'CFD simulation &mdash; so flow separation past the stall angle is a stylized visual cue ' +
            'rather than a solved result.' +
          '</p>' +
        '</div>';

      var canvas = container.querySelector('#airfoil-canvas');
      var ctx = canvas.getContext('2d');
      var slider = container.querySelector('#aoa-slider');
      var aoaValueEl = container.querySelector('#aoa-value');
      var clValueEl = container.querySelector('#cl-value');
      var stallWarningEl = container.querySelector('#stall-warning');

      var dashOffset = 0;
      var rafId = null;
      var geo, gammas, streamlines;

      function palette() {
        var s = getComputedStyle(document.documentElement);
        return {
          ink: s.getPropertyValue('--ink').trim(),
          accent: s.getPropertyValue('--accent').trim()
        };
      }

      function recompute() {
        var alphaDeg = parseFloat(slider.value);
        geo = AirfoilSim.buildGeometry(alphaDeg);
        gammas = AirfoilSim.solveCirculation(geo, 1);
        streamlines = AirfoilSim.computeStreamlines(geo, gammas, 1, alphaDeg);

        var totalGamma = gammas.reduce(function (a, g) { return a + g; }, 0);
        // Kutta–Joukowski, nondimensional chord = 1, U = 1. Negated because the
        // point-vortex kernel above uses the counterclockwise-positive
        // convention, opposite the clockwise convention L = rho * U * Gamma assumes.
        var cl = -2 * totalGamma;

        aoaValueEl.textContent = alphaDeg.toFixed(0);
        clValueEl.textContent = cl.toFixed(2);
        stallWarningEl.textContent = Math.abs(alphaDeg) > AirfoilSim.STALL_ANGLE_DEG
          ? 'Flow separating — stalled'
          : '';
      }

      // Maps nondimensional chord-space coordinates to canvas pixels.
      function toScreen(x, y) {
        var scale = 300;
        var originX = canvas.width * 0.38;
        var originY = canvas.height * 0.5;
        return { x: originX + x * scale, y: originY - y * scale };
      }

      function draw() {
        var pal = palette();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.lineWidth = 1.4;
        ctx.strokeStyle = pal.accent;
        ctx.globalAlpha = 0.55;
        ctx.setLineDash([6, 5]);
        ctx.lineDashOffset = -dashOffset;
        streamlines.forEach(function (pts) {
          ctx.beginPath();
          pts.forEach(function (p, idx) {
            var sp = toScreen(p.x, p.y);
            if (idx === 0) ctx.moveTo(sp.x, sp.y); else ctx.lineTo(sp.x, sp.y);
          });
          ctx.stroke();
        });
        ctx.setLineDash([]);
        ctx.globalAlpha = 1;

        ctx.beginPath();
        geo.polygon.forEach(function (p, idx) {
          var sp = toScreen(p.x, p.y);
          if (idx === 0) ctx.moveTo(sp.x, sp.y); else ctx.lineTo(sp.x, sp.y);
        });
        ctx.closePath();
        ctx.fillStyle = pal.ink;
        ctx.globalAlpha = 0.92;
        ctx.fill();
        ctx.globalAlpha = 1;
      }

      function tick() {
        dashOffset = (dashOffset + 0.6) % 11;
        draw();
        rafId = requestAnimationFrame(tick);
      }

      slider.addEventListener('input', recompute);
      recompute();
      tick();

      activeToolRedraw = draw;
      activeToolCleanup = function () { cancelAnimationFrame(rafId); };
    }

    // ---- Home grid ----------------------------------------------------

    var toolGrid = document.getElementById('tool-grid');

    TOOLS.forEach(function (tool) {
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'text-left rounded-2xl p-6 flex flex-col gap-3 transition';
      card.style.background = 'var(--bg-elevated)';
      card.style.border = '1px solid var(--border)';
      card.addEventListener('mouseenter', function () { card.style.borderColor = 'var(--accent)'; });
      card.addEventListener('mouseleave', function () { card.style.borderColor = 'var(--border)'; });

      var title = document.createElement('div');
      title.className = 'font-display text-lg font-bold';
      title.textContent = tool.title;

      var desc = document.createElement('div');
      desc.className = 'text-sm';
      desc.style.color = 'var(--ink-dim)';
      desc.textContent = tool.description;

      var open = document.createElement('div');
      open.className = 'text-sm font-medium mt-auto';
      open.style.color = 'var(--accent)';
      open.textContent = 'Open →';

      card.appendChild(title);
      card.appendChild(desc);
      card.appendChild(open);

      card.addEventListener('click', function () { openTool(tool.id); });

      toolGrid.appendChild(card);
    });

    // ---- Navigation: home view <-> tool view --------------------------

    var homeView = document.getElementById('home-view');
    var toolView = document.getElementById('tool-view');
    var toolViewTitle = document.getElementById('tool-view-title');
    var toolViewContent = document.getElementById('tool-view-content');

    function openTool(id) {
      var tool = TOOLS.filter(function (t) { return t.id === id; })[0];
      if (!tool) return;

      if (activeToolCleanup) { activeToolCleanup(); activeToolCleanup = null; }
      activeToolRedraw = null;

      toolViewTitle.textContent = tool.title;
      toolViewContent.innerHTML = '';
      tool.render(toolViewContent);

      homeView.hidden = true;
      toolView.hidden = false;
    }

    function closeTool() {
      toolView.hidden = true;
      homeView.hidden = false;

      if (activeToolCleanup) { activeToolCleanup(); activeToolCleanup = null; }
      activeToolRedraw = null;
    }

    document.getElementById('back-to-home').addEventListener('click', closeTool);

    // ---- Theme toggle ---------------------------------------------------

    var themeToggle = document.getElementById('theme-toggle');
    var themeToggleIcon = document.getElementById('theme-toggle-icon');
    var themeToggleLabel = document.getElementById('theme-toggle-label');

    var sunIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.2" y1="4.2" x2="5.6" y2="5.6"/><line x1="18.4" y1="18.4" x2="19.8" y2="19.8"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.2" y1="19.8" x2="5.6" y2="18.4"/><line x1="18.4" y1="5.6" x2="19.8" y2="4.2"/></svg>';
    var moonIcon = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>';

    function updateThemeToggle(theme) {
      var isDark = theme === 'dark';
      themeToggleIcon.innerHTML = isDark ? moonIcon : sunIcon;
      themeToggleLabel.textContent = isDark ? 'Light' : 'Dark';
      themeToggle.setAttribute('aria-pressed', String(isDark));
    }

    updateThemeToggle(document.documentElement.getAttribute('data-theme'));

    themeToggle.addEventListener('click', function () {
      var current = document.documentElement.getAttribute('data-theme');
      var next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeToggle(next);
      if (activeToolRedraw) activeToolRedraw();
    });
  </script>

</body>
</html>
